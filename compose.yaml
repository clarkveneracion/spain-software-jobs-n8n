services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:?Set a tested version in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Madrid}
      TZ: ${TZ:-Europe/Madrid}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Generate a private encryption key}
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
